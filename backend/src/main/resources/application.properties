# =====================================================================
# Sistema de Gestao para Marmoraria - configuracao Quarkus
# =====================================================================

# Datasource PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:marmoraria}
quarkus.datasource.password=${DB_PASSWORD:marmoraria}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/marmoraria_db}

# Hibernate ORM: NAO gerar schema (schema e controlado 100% via Flyway)
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# CORS (necessario apenas em modo dev, quando o front roda separado na porta 5173)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Servir o build do React (monolito): a pasta frontend/dist deve ser copiada para
# backend/src/main/resources/META-INF/resources antes do build (ver README).
quarkus.http.root-path=/

# Porta padrao da aplicacao (unico deploy: API + front)
quarkus.http.port=8080

# Log
quarkus.log.level=INFO
%dev.quarkus.log.category."com.marmoraria".level=DEBUG
