version: "3.8"

services:
  db:
    image: postgres:16
    container_name: marmoraria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marmoraria
      POSTGRES_PASSWORD: marmoraria
      POSTGRES_DB: marmoraria_db
    ports:
      - "5432:5432"
    volumes:
      - marmoraria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marmoraria -d marmoraria_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marmoraria_pgdata:
